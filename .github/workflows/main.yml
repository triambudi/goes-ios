
name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source
        run: |
          rm -rf gowes-ios
          unzip -q gowes-ios.zip -d .
          test -f gowes-ios/project.yml

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcodebuild -version

      - name: Install tools
        run: brew install xcodegen ldid

      - name: Generate Xcode project
        working-directory: gowes-ios
        run: xcodegen generate

      - name: Build IPA
        working-directory: gowes-ios
        run: |
          xcodebuild \
            -project Gowes.xcodeproj \
            -scheme Gowes \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Gowes.app Payload/

          ldid -S Payload/Gowes.app/Gowes

          zip -qry Gowes.ipa Payload

      - name: Verify IPA
        working-directory: gowes-ios
        run: |
          test -s Gowes.ipa
          unzip -l Gowes.ipa
          
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Gowes-ipa
          path: gowes-ios/Gowes.ipa
          if-no-files-found: error
